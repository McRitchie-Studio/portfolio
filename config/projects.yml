# The projects on the portfolio, newest first. There is no database: this file
# is the whole list, loaded once by app/models/project.rb and checked by
# test/models/project_test.rb.
#
#   slug         stable id; also the page anchor (#cyvasse)
#   name         what the project was called
#   year         the year it started (an integer; the list sorts on it)
#   until        optional last active year, shown as "2015–17"
#   description  one line, 160 characters at most
#   stack        what it was built with, as it was built
#   github       the original repository
#   live         optional https link on mcritchie.studio
#   rebuild      true when `live` is a modern rebuild, not the original app

- slug: mcritchie-studio
  name: McRitchie Studio
  year: 2026
  description: An app studio where a team of AI agents designs, builds, reviews and ships web apps, including the rebuilds on this page.
  stack: Rails 8 · Solana · AI agents
  github: https://github.com/McRitchie-Studio/mcritchie-studio
  live: https://mcritchie.studio

- slug: weekly-lock
